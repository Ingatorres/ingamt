<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Símbolo Profesional Dinámico</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a; /* Un fondo oscuro para resaltar el símbolo */
        }
        .symbol-container {
            width: 250px;
            height: 250px;
        }
    </style>
</head>
<body>

    <div class="symbol-container">
        <!--
          SÍMBOLO SVG PROFESIONAL Y FLUIDO
          Concepto: Un único trazo continuo que representa la evolución desde una base sólida (ingeniería) 
          hacia una visión innovadora y fluida (estrategia e IA).
          El diseño es minimalista, abstracto y dinámico.
        -->
        <svg width="100%" height="100%" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- 
                  El degradado define la paleta de colores profesional y tecnológica.
                  Será animado para dar una sensación de energía y dinamismo.
                -->
                <linearGradient id="dynamicGradient" x1="-100%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00b4d8" />
                    <stop offset="50%" stop-color="#0077b6" />
                    <stop offset="100%" stop-color="#03045e" />
                    <!-- La animación mueve el degradado a lo largo del eje X, creando un flujo constante -->
                    <animate attributeName="x1" from="-100%" to="100%" dur="4s" repeatCount="indefinite" />
                    <animate attributeName="x2" from="0%" to="200%" dur="4s" repeatCount="indefinite" />
                </linearGradient>
            </defs>
            
            <!--
              EL OBJETO ÚNICO
              Un solo <path> crea toda la forma. El trazo es grueso y suave.
              La forma comienza con una base estable, se eleva en una curva que representa crecimiento y estrategia,
              y culmina en un bucle que simboliza la innovación, las ideas y la naturaleza cíclica del aprendizaje (IA).
            -->
            <path d="M 25 80 
                     C 10 80, 15 40, 50 30 
                     S 85 20, 75 50 
                     C 65 80, 45 90, 25 80 Z"
                  fill="none" 
                  stroke="url(#dynamicGradient)" 
                  stroke-width="5" 
                  stroke-linecap="round" 
                  stroke-linejoin="round"
            />
        </svg>
    </div>

</body>
</html>
